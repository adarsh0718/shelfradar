        setCurrentMode(userData.role);
        try {
          localStorage.setItem('shelfradar_auth_user', JSON.stringify(userData));
        } catch (e) {}
      };

      const handleLogout = () => {
        setCurrentUser(null);
        try {
          localStorage.removeItem('shelfradar_auth_user');
        } catch (e) {}
      };

      const handleModeSelect = (mode) => {
        setCurrentMode(mode);
        if (currentUser && currentUser.role !== mode) {
          let persona = null;
          if (mode === 'customer') {
            persona = { role: 'customer', name: 'Adarsh', address: 'Diamond Park, Vizag', phone: '+91 98480 12345' };
          } else if (mode === 'shopkeeper') {
            persona = { role: 'shopkeeper', name: 'Sri Ram Electronics', address: 'Shop #12, Dwaraka Nagar', phone: '+91 891 254 1102' };
          } else if (mode === 'delivery') {
            persona = { role: 'delivery', name: 'Ravi Kumar', vehicle: 'Hero Electric (AP 31 DZ 4421)', phone: '+91 70132 88419' };
          }
          if (persona) {
            setCurrentUser(persona);
            try { localStorage.setItem('shelfradar_auth_user', JSON.stringify(persona)); } catch (e) {}
          }
        } else if (!currentUser) {
          let persona = null;
          if (mode === 'customer') persona = { role: 'customer', name: 'Adarsh', address: 'Diamond Park, Vizag', phone: '+91 98480 12345' };
          else if (mode === 'shopkeeper') persona = { role: 'shopkeeper', name: 'Sri Ram Electronics', address: 'Shop #12, Dwaraka Nagar', phone: '+91 891 254 1102' };
          else if (mode === 'delivery') persona = { role: 'delivery', name: 'Ravi Kumar', vehicle: 'Hero Electric (AP 31 DZ 4421)', phone: '+91 70132 88419' };
          if (persona) {
            setCurrentUser(persona);
            try { localStorage.setItem('shelfradar_auth_user', JSON.stringify(persona)); } catch (e) {}
          }
        }
      };

      const requestGPS = useCallback(async () => {
        const coords = await getLiveGPS();
        setGpsState(coords);
      }, []);

      const handleSelectNeighborhood = useCallback((neighborhood) => {
        setGpsState({
          isLive: false,
          lat: neighborhood.lat,
          lng: neighborhood.lng,
          address: neighborhood.name,
          zoneName: neighborhood.short
        });
      }, []);

      const playAudioCue = (type) => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          if (type === 'alert') {
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
          } else if (type === 'success') {
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
          } else if (type === 'radar') {
            osc.frequency.setValueAtTime(659.25, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1318.5, ctx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.25);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
          }
        } catch (e) {
          // Audio autoplay policy or headless mode
        }
      };

      // Real WebSocket connection with auto-reconnect
      const connectWs = useCallback(() => {
        if (typeof window === 'undefined') return;
        try {
          const AWS_WS_ENDPOINT = 'wss://mk0k0vr59h.execute-api.us-east-1.amazonaws.com/dev';
          const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          const wsUrl = isLocal ? `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws` : AWS_WS_ENDPOINT;

          const ws = new WebSocket(wsUrl);
          wsRef.current = ws;

          ws.onopen = () => {
            console.log('[ShelfRadar AWS WS] Multi-device link established:', wsUrl);
            setSyncStatus('connected');
          };

          ws.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              const { type, payload, shopEarnings: sEarn, deliveryEarnings: dEarn } = data;
              if (sEarn !== undefined) setShopEarnings(sEarn);
              if (dEarn !== undefined) setDeliveryEarnings(dEarn);

              if (type === 'INITIAL_STATE') {
                if (payload.pings) setPings(payload.pings);
                if (payload.orders) setOrders(payload.orders);
                if (payload.shopEarnings !== undefined) setShopEarnings(payload.shopEarnings);
                if (payload.deliveryEarnings !== undefined) setDeliveryEarnings(payload.deliveryEarnings);
              } else if (type === 'NEW_PING') {
                playAudioCue('alert');
                setPings(prev => [payload, ...prev.filter(p => p.pingId !== payload.pingId)]);
              } else if (type === 'CLAIM_PING') {
                playAudioCue('success');
                setPings(prev => prev.map(p => p.pingId === payload.pingId ? { ...p, status: 'CLAIMED', claimData: payload.claimData } : p));
                setActiveBroadcast(curr => curr && curr.pingId === payload.pingId ? null : curr);
                setClaimedBroadcast(payload);
              } else if (type === 'ORDER_CREATED') {
                playAudioCue('radar');
                setOrders(prev => [payload, ...prev.filter(o => o.orderId !== payload.orderId)]);
                setCurrentOrder(payload);
              } else if (type === 'ORDER_STATUS_UPDATE') {
                setOrders(prev => prev.map(o => o.orderId === payload.orderId ? { ...o, deliveryStatus: payload.deliveryStatus } : o));
                setCurrentOrder(curr => curr && curr.orderId === payload.orderId ? { ...curr, deliveryStatus: payload.deliveryStatus } : curr);
                if (payload.deliveryStatus === 'DELIVERED') {
                  playAudioCue('success');
                }
              } else if (type === 'DELIVERY_LOCATION_UPDATE') {
                if (payload) {
                  setOrders(prev => prev.map(o => o.orderId === payload.orderId ? { ...o, courierLocation: payload } : o));
                  setCurrentOrder(curr => (curr && curr.orderId === payload.orderId) ? { ...curr, courierLocation: payload } : curr);
                }
              }
            } catch (err) {
              console.warn('[ShelfRadar WS] Message parse error:', err);
            }
          };

          ws.onerror = () => {
            setSyncStatus('offline');
          };

          ws.onclose = () => {
            setSyncStatus('offline');
            setTimeout(connectWs, 3000);
          };
        } catch (err) {
          setSyncStatus('offline');
        }
      }, []);

      useEffect(() => {
        // Connect WebSocket sync; avoid auto-invoking requestGPS() on mount to prevent inaccurate ISP IP drift
        connectWs();

        if (syncChannel) {
          syncChannel.onmessage = (event) => {
            const { type, payload } = event.data || {};
            if (type === 'NEW_PING') setPings(p => [payload, ...p.filter(x => x.pingId !== payload.pingId)]);
            if (type === 'CLAIM_PING') {
              setPings(prev => prev.map(p => p.pingId === payload.pingId ? { ...p, status: 'CLAIMED', claimData: payload.claimData } : p));
              setActiveBroadcast(curr => curr && curr.pingId === payload.pingId ? null : curr);
              setClaimedBroadcast(payload);
            }
            if (type === 'ORDER_CREATED') {
              setOrders(o => [payload, ...o.filter(x => x.orderId !== payload.orderId)]);
              setCurrentOrder(payload);
            }
            if (type === 'ORDER_STATUS_UPDATE') {
              setOrders(prev => prev.map(o => o.orderId === payload.orderId ? { ...o, deliveryStatus: payload.deliveryStatus } : o));
              setCurrentOrder(curr => curr && curr.orderId === payload.orderId ? { ...curr, deliveryStatus: payload.deliveryStatus } : curr);
            }
            if (type === 'DELIVERY_LOCATION_UPDATE') {
              if (payload) {
                setOrders(prev => prev.map(o => o.orderId === payload.orderId ? { ...o, courierLocation: payload } : o));
                setCurrentOrder(curr => (curr && curr.orderId === payload.orderId) ? { ...curr, courierLocation: payload } : curr);
              }
            }
          };
        }
      }, [connectWs]);

      const broadcastAction = (type, payload) => {
        // BroadcastChannel for instant same-browser tab sync
        if (syncChannel) {
          try { syncChannel.postMessage({ type, payload }); } catch(e) {}
        }
        // WebSocket for cross-device public internet sync via AWS API Gateway
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          try { wsRef.current.send(JSON.stringify({ action: 'broadcast', type, payload })); } catch(e) {}
        }
      };

      const generateQuotesForPing = (ping, radius) => {
        setTimeout(() => {
          setClaimedBroadcast(curr => {
            const r = parseFloat(radius) || 1.0;
            const cLat = ping.location?.lat || gpsState?.lat || 17.7286;
            const cLng = ping.location?.lng || gpsState?.lng || 83.3093;

            // Base price estimation from ping item/category
            const estimatedBase = ping.estimatedPrice || (ping.category === 'Electronics & Hardware' ? 190 : ping.category === 'Snacks & Juices' ? 80 : 120);

            // Candidate verified shops strictly within radius r
            const candidateShops = getShopsWithinRadius(cLat, cLng, r);

            // Filter candidate shops to match category where possible
            let relevantShops = candidateShops.filter(s => {
              if (ping.category && s.category) {
                const sCat = s.category.toLowerCase();
                const pCat = ping.category.toLowerCase();
                if (pCat.includes('snack') || pCat.includes('juice')) return sCat.includes('snack') || sCat.includes('general') || sCat.includes('supermarket');
                if (pCat.includes('stationery') || pCat.includes('office') || pCat.includes('a4') || pCat.includes('pen')) return sCat.includes('stationery') || sCat.includes('office') || sCat.includes('bazaar');
                if (pCat.includes('electronic') || pCat.includes('hardware')) return sCat.includes('electronic') || sCat.includes('hardware') || sCat.includes('tech');
                if (pCat.includes('pharmacy') || pCat.includes('wellness')) return sCat.includes('pharmacy') || sCat.includes('wellness');
              }
              return true;
            });
            if (relevantShops.length === 0) relevantShops = candidateShops;

            // Curate quote comparison across distance & pricing spectrum
            let quoteCandidates = [];
            if (r >= 20.0) {
              const localFastest = relevantShops.find(s => s.distanceKm <= 1.0) || relevantShops[0];
              const neighborhood = relevantShops.find(s => s.distanceKm > 1.0 && s.distanceKm <= 5.0);
              const wholesaleHub1 = relevantShops.find(s => s.distanceKm > 12.0 && s.discountPct >= 45) || relevantShops[relevantShops.length - 1];
              const wholesaleHub2 = relevantShops.find(s => s.distanceKm > 10.0 && s.shopId !== wholesaleHub1?.shopId);
              quoteCandidates = [localFastest, neighborhood, wholesaleHub2, wholesaleHub1].filter(Boolean);
              quoteCandidates = Array.from(new Set(quoteCandidates));
            } else if (r >= 10.0) {
              const localFastest = relevantShops.find(s => s.distanceKm <= 1.0) || relevantShops[0];
              const neighborhood = relevantShops.find(s => s.distanceKm > 1.0 && s.distanceKm <= 5.0);
              const hub10 = relevantShops.find(s => s.distanceKm > 5.0 && s.distanceKm <= 10.0) || relevantShops[relevantShops.length - 1];
              quoteCandidates = [localFastest, neighborhood, hub10].filter(Boolean);
              quoteCandidates = Array.from(new Set(quoteCandidates));
            } else if (r >= 5.0) {
              const localFastest = relevantShops.find(s => s.distanceKm <= 1.0) || relevantShops[0];
              const neighborhood = relevantShops.filter(s => s.distanceKm > 1.0 && s.distanceKm <= 5.0).slice(0, 3);
              quoteCandidates = [localFastest, ...neighborhood].filter(Boolean);
              quoteCandidates = Array.from(new Set(quoteCandidates));
            } else {
              quoteCandidates = relevantShops.filter(s => s.distanceKm <= 1.0).slice(0, 4);
              if (quoteCandidates.length === 0) quoteCandidates = relevantShops.slice(0, 4);
            }

            // Generate quotes strictly from candidate shops within the selected radius
            const quotesList = quoteCandidates.map((shop, idx) => {
              const discount = shop.discountPct || 0;
              const discountedPrice = Math.max(10, Math.round(estimatedBase * (1 - discount / 100)));
              const savings = Math.max(0, estimatedBase - discountedPrice);
              const estMins = shop.deliveryEstMins || (shop.distanceKm <= 1.0 ? 8 + idx * 2 : shop.distanceKm <= 5.0 ? 15 + idx * 3 : 30 + idx * 5);
              const delFee = shop.distanceKm <= 1.0 ? 25 : shop.distanceKm <= 5.0 ? 35 : shop.distanceKm <= 10.0 ? 45 : 55;

              let badge = `⚡ ${shop.distanceKm} KM • ${estMins} MINS`;
              if (discount >= 35) badge = `🔥 ${discount}% OFF WHOLESALE`;
              else if (discount >= 15) badge = `🏷️ ${discount}% OFF NEIGHBORHOOD`;
              else if (idx === 0) badge = `⚡ FASTEST LOCAL (${estMins} MINS)`;

              return {
                quoteId: `q_${shop.shopId}_${Date.now()}`,
                shopId: shop.shopId,
                shopName: shop.name,
                shopAddress: shop.address,
                area: `${shop.area} (${shop.distanceKm} KM)`,
                distanceKm: shop.distanceKm,
                itemPrice: discountedPrice,
                discountPct: discount,
                savings: savings,
                deliveryFee: delFee,
                deliveryEstMins: estMins,
                phone: shop.phone || '+91 891 254 1102',
                badge: badge,
                tagline: `${shop.priceTag || 'Verified Store'} • Distance: ${shop.distanceKm} km`
              };
            });

            // Ensure at least 1 quote if candidateShops has any store
            if (quotesList.length === 0 && candidateShops.length > 0) {
              const s = candidateShops[0];
              quotesList.push({
                quoteId: `q_${s.shopId}_${Date.now()}`,
                shopId: s.shopId,
                shopName: s.name,
                shopAddress: s.address,
                area: `${s.area} (${s.distanceKm} KM)`,
                distanceKm: s.distanceKm,
                itemPrice: estimatedBase,
                discountPct: 0,
                savings: 0,
                deliveryFee: 25,
                deliveryEstMins: 9,
                phone: s.phone,
                badge: `⚡ FASTEST (${s.distanceKm} KM)`,
                tagline: `Distance: ${s.distanceKm} km`
              });
            }

            const defaultSelected = (r >= 10.0 && quotesList.length > 1) 
              ? quotesList[quotesList.length - 1] 
              : quotesList[0];

            const claimData = {
              ...ping,
              radiusKm: r,
              claimData: defaultSelected,
              quotes: quotesList,
              status: 'CLAIMED'
            };

            setActiveBroadcast(null);
            broadcastAction('CLAIM_PING', claimData);
            return claimData;
          });
        }, 1200);
      };

      const handleExpandRadius = (newRadius) => {
        const currentPing = activeBroadcast || claimedBroadcast;
        if (!currentPing) return;
        const updatedPing = { ...currentPing, radiusKm: newRadius };
        setActiveBroadcast(updatedPing);
        setClaimedBroadcast(null);
        broadcastAction('NEW_PING', updatedPing);
        generateQuotesForPing(updatedPing, newRadius);
      };

      const handleBroadcast = async (pingData) => {
        const newPing = { ...pingData, pingId: 'ping_' + Date.now(), status: 'ACTIVE' };
        setActiveBroadcast(newPing);
        setPings(p => [newPing, ...p.filter(item => item.pingId !== newPing.pingId)]);

        broadcastAction('NEW_PING', newPing);
        generateQuotesForPing(newPing, pingData.radiusKm || 1.0);
      };

      const handleClaim = async (pingId, shopDetails, itemPrice) => {
        const payload = { pingId, claimData: { ...shopDetails, itemPrice } };
        setPings(prev => prev.map(p => p.pingId === pingId ? { ...p, status: 'CLAIMED', claimData: payload.claimData } : p));
        setClaimedBroadcast(curr => {
          const quotes = curr?.quotes ? [payload.claimData, ...curr.quotes.filter(q => q.shopId !== shopDetails.shopId)] : [payload.claimData];
          return {
            ...(curr || {}),
            pingId,
            claimData: payload.claimData,
            quotes
          };
        });
        broadcastAction('CLAIM_PING', payload);
      };

      const handlePayment = (orderData) => {
        setOrders(o => [orderData, ...o.filter(x => x.orderId !== orderData.orderId)]);
        setCurrentOrder(orderData);
        setClaimedBroadcast(null);
        broadcastAction('ORDER_CREATED', orderData);
      };

      const handleUpdateOrderStatus = (orderId, deliveryStatus) => {
        const payload = { orderId, deliveryStatus };
        setOrders(prev => prev.map(o => o.orderId === orderId ? { ...o, deliveryStatus } : o));
        if (currentOrder && currentOrder.orderId === orderId) {
          setCurrentOrder(curr => ({ ...curr, deliveryStatus }));
        }
        if (deliveryStatus === 'DELIVERED') {
          playAudioCue('success');
        }
        broadcastAction('ORDER_STATUS_UPDATE', payload);
      };

      const handleUpdateCourierLocation = (orderId, locationData) => {
        const payload = { orderId, ...locationData };
        setOrders(prev => prev.map(o => o.orderId === orderId ? { ...o, courierLocation: payload } : o));
        setCurrentOrder(curr => (curr && curr.orderId === orderId) ? { ...curr, courierLocation: payload } : curr);
        broadcastAction('DELIVERY_LOCATION_UPDATE', payload);
      };

      const handleSimulateCourierAdvance = () => {
        const orderToAdvance = currentOrder || (orders.length > 0 ? orders[0] : null);
        if (!orderToAdvance) return;
        const currLoc = orderToAdvance.courierLocation || { progress: 25, speed: 28, etaMinutes: 5, distanceMeters: 450 };
        const nextProg = Math.min(95, (currLoc.progress || 25) + 20);
        const nextEta = Math.max(1, Math.round((100 - nextProg) / 16));
        const nextDist = Math.max(50, Math.round((100 - nextProg) * 6));
        handleUpdateCourierLocation(orderToAdvance.orderId, {
          progress: nextProg,
          speed: 28,
          etaMinutes: nextEta,
          distanceMeters: nextDist,
          riderName: 'Ravi Kumar',
          vehicleNo: 'Hero Electric (AP 31 DZ 4421)'
        });
      };

      return (
        <div className="relative min-h-screen">
          <div className="fixed inset-0 pointer-events-none -z-20 bg-gradient-to-br from-sky-100 via-blue-50/70 to-indigo-100/80" />
          <div className="fixed inset-0 pointer-events-none -z-10 faint-grid-pattern" />

          <Navbar
            currentMode={currentMode}
            onModeChange={handleModeSelect}
            activeDeliveryCount={orders.filter(o => o.deliveryStatus === 'READY_FOR_PICKUP').length}
            gpsState={gpsState}
            onRequestGPS={requestGPS}
            syncStatus={syncStatus}
            currentUser={currentUser}
            onLogout={currentUser ? handleLogout : null}
          />

          <main className="relative z-10 pb-20">
            {!currentUser ? (
              <AuthPortalGateway
                onLogin={handleLogin}
                activeDeliveryCount={orders.filter(o => o.deliveryStatus === 'READY_FOR_PICKUP').length}
              />
            ) : (
              <>
                {currentMode === 'customer' && (
                  <CustomerView
                    onBroadcastPing={handleBroadcast}
                    activeBroadcast={activeBroadcast}
                    claimedBroadcast={claimedBroadcast}
                    currentOrder={currentOrder}
                    onResetBroadcast={() => { setActiveBroadcast(null); setClaimedBroadcast(null); setCurrentOrder(null); }}
                    onCompletePayment={handlePayment}
                    gpsState={gpsState}
                    onRequestGPS={requestGPS}
                    onSimulateCourierAdvance={handleSimulateCourierAdvance}
                    onExpandRadius={handleExpandRadius}
                    onSelectNeighborhood={handleSelectNeighborhood}
                  />
                )}

                {currentMode === 'shopkeeper' && (
                  <ShopkeeperView
                    pings={pings}
                    onClaimPing={handleClaim}
                    todayEarnings={shopEarnings}
                    gpsState={gpsState}
                    onRequestGPS={requestGPS}
                  />
                )}

                {currentMode === 'delivery' && (
                  <DeliveryPartnerView
                    orders={orders}
                    todayEarnings={deliveryEarnings}
                    onRequestGPS={requestGPS}
                    onUpdateStatus={handleUpdateOrderStatus}
                    onUpdateCourierLocation={handleUpdateCourierLocation}
                  />
                )}
              </>
            )}
          </main>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
