    function findMatchingCatalogItem(query) {
      if (!query) return null;
      const q = query.toLowerCase().trim();
      return ESSENTIALS_CATALOG.find(item => 
        item.name.toLowerCase().includes(q) || 
        q.includes(item.name.toLowerCase()) ||
        (item.searchQuery && item.searchQuery.toLowerCase().includes(q)) ||
        (item.category && item.category.toLowerCase().includes(q))
      ) || null;
    }

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 0.4;
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return parseFloat((R * c).toFixed(2));
    }

    function calculateRoadDistanceKm(cLat, cLng, shop) {
      if (!cLat || !cLng || !shop.lat || !shop.lng) return shop.roadDistanceKm || 0.4;
      const dCenterLat = Math.abs(cLat - VIZAG_DEFAULT_LOCATION.lat);
      const dCenterLng = Math.abs(cLng - VIZAG_DEFAULT_LOCATION.lng);
      // When anchored at city center (Dwaraka Nagar), return the authentic Google Maps road distance
      if (dCenterLat < 0.008 && dCenterLng < 0.008) {
        return shop.roadDistanceKm;
      }
      // If customer moves to another anchor, calculate road route distance with Vizag winding terrain coefficient
      const straight = calculateDistanceKm(cLat, cLng, shop.lat, shop.lng);
      const roadFactor = straight > 8 ? 1.52 : straight > 3 ? 1.40 : 1.25;
      return parseFloat((straight * roadFactor).toFixed(1));
    }

    function getShopsWithinRadius(lat, lng, maxRadiusKm = 1.0) {
      const cLat = lat || VIZAG_DEFAULT_LOCATION.lat;
      const cLng = lng || VIZAG_DEFAULT_LOCATION.lng;
      return VIZAG_SHOPS.map(shop => {
        const roadDist = calculateRoadDistanceKm(cLat, cLng, shop);
        return {
          ...shop,
          distanceKm: roadDist
        };
      })
      .filter(shop => shop.distanceKm <= maxRadiusKm)
      .sort((a, b) => a.distanceKm - b.distanceKm);
    }

    function getShopsWithin1Km(lat, lng) {
      return getShopsWithinRadius(lat, lng, 1.0);
    }

    function getShopCoords(shopDetails) {
      if (shopDetails && shopDetails.lat && shopDetails.lng) {
        return { lat: parseFloat(shopDetails.lat), lng: parseFloat(shopDetails.lng) };
      }
      const name = (shopDetails?.shopName || '').toLowerCase();
      const matched = VIZAG_SHOPS.find(s => s.name.toLowerCase().includes(name) || name.includes(s.name.toLowerCase()));
      if (matched) return { lat: matched.lat, lng: matched.lng };
      return { lat: 17.7298, lng: 83.3105 }; // Sri Ram Electronics, Dwaraka Nagar
    }

    function getCustomerCoords(customerLocation, gpsState) {
      if (customerLocation && customerLocation.lat && customerLocation.lng) {
        return { lat: parseFloat(customerLocation.lat), lng: parseFloat(customerLocation.lng) };
      }
      if (gpsState && gpsState.lat && gpsState.lng) {
        return { lat: parseFloat(gpsState.lat), lng: parseFloat(gpsState.lng) };
      }
      return { lat: 17.7286, lng: 83.3093 }; // Dwaraka Nagar / Diamond Park
    }

    function getLiveGPS() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve({ ...VIZAG_DEFAULT_LOCATION, isFallback: true });
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            resolve({
              lat: parseFloat(pos.coords.latitude.toFixed(5)),
              lng: parseFloat(pos.coords.longitude.toFixed(5)),
              accuracy: Math.round(pos.coords.accuracy),
              address: 'Device Live GPS, Visakhapatnam, AP',
              isLiveGPS: true
            });
          },
          () => resolve({ ...VIZAG_DEFAULT_LOCATION, isFallback: true }),
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 5000 }
        );
      });
    }

    // ==========================================
    // INTERACTIVE REAL-WORLD DELIVERY MAP (LEAFLET + GOOGLE MAPS)
    // ==========================================
    function InteractiveDeliveryMap({ order, gpsState }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersRef = useRef({});
      const polylineRef = useRef(null);

      const shopCoords = getShopCoords(order?.shopDetails);
      const custCoords = getCustomerCoords(order?.customerLocation, gpsState);

      const courier = order?.courierLocation || {
        progress: order?.deliveryStatus === 'DELIVERED' ? 100 : (order?.deliveryStatus === 'IN_TRANSIT' ? 50 : 20),
        speed: 28,
        etaMinutes: 5,
        riderName: 'Ravi Kumar',
        vehicleNo: 'Hero Electric (AP 31 DZ 4421)'
      };

      const progressRatio = Math.max(0.05, Math.min(0.95, (courier.progress || 20) / 100));
      const courierLat = shopCoords.lat + (custCoords.lat - shopCoords.lat) * progressRatio;
      const courierLng = shopCoords.lng + (custCoords.lng - shopCoords.lng) * progressRatio;

      const googleMapsDirUrl = `https://www.google.com/maps/dir/?api=1&origin=${shopCoords.lat},${shopCoords.lng}&destination=${custCoords.lat},${custCoords.lng}&travelmode=driving`;

      useEffect(() => {
        if (!mapContainerRef.current || typeof L === 'undefined') return;

        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: [courierLat, courierLng],
            zoom: 14,
            zoomControl: false,
            attributionControl: false
          });

          L.control.zoom({ position: 'topright' }).addTo(map);

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            subdomains: ['a', 'b', 'c']
          }).addTo(map);

          mapInstanceRef.current = map;
        }

        const map = mapInstanceRef.current;

        const shopIcon = L.divIcon({
          className: 'custom-map-pin',
          html: `
            <div style="display:flex; flex-direction:column; align-items:center; cursor:pointer;">
              <div style="width:38px; height:38px; border-radius:12px; background:#0f172a; border:2.5px solid #10b981; color:#34d399; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 16px rgba(16,185,129,0.35); font-size:18px;">
                🏪
              </div>
              <span style="font-size:9px; font-weight:900; background:#0f172a; color:#6ee7b7; padding:2px 6px; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,0.3); margin-top:2px; white-space:nowrap; border:1px solid rgba(52,211,153,0.3);">
                ${(order?.shopDetails?.shopName || 'SHOP').split(' ')[0]}
              </span>
            </div>
          `,
          iconSize: [40, 48],
          iconAnchor: [20, 44],
          popupAnchor: [0, -42]
        });

        const custIcon = L.divIcon({
          className: 'custom-map-pin',
          html: `
            <div style="display:flex; flex-direction:column; align-items:center; cursor:pointer;">
              <div style="width:38px; height:38px; border-radius:12px; background:#1e1b4b; border:2.5px solid #38bdf8; color:#38bdf8; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 16px rgba(14,165,233,0.35); font-size:18px;">
                📍
              </div>
              <span style="font-size:9px; font-weight:900; background:#1e1b4b; color:#7dd3fc; padding:2px 6px; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,0.3); margin-top:2px; white-space:nowrap; border:1px solid rgba(56,189,248,0.3);">
                YOU
              </span>
            </div>
          `,
          iconSize: [40, 48],
          iconAnchor: [20, 44],
          popupAnchor: [0, -42]
        });

        const courierIcon = L.divIcon({
          className: 'custom-map-pin',
          html: `
            <div style="position:relative; display:flex; flex-direction:column; align-items:center; cursor:pointer;">
              <div class="map-pulse-ring" style="position:absolute; inset:-4px; border-radius:9999px; background:rgba(14,165,233,0.45); pointer-events:none;"></div>
              <div style="position:relative; width:44px; height:44px; border-radius:14px; background:#0284c7; border:2.5px solid #ffffff; color:#ffffff; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 25px rgba(14,165,233,0.5); font-size:20px;">
                🛵
              </div>
              <span style="font-size:9px; font-weight:900; background:#082f49; color:#38bdf8; padding:2px 6px; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,0.3); margin-top:2px; white-space:nowrap; border:1px solid rgba(56,189,248,0.4);">
                ${courier.riderName ? courier.riderName.split(' ')[0] : 'Ravi'} (${courier.speed || 28} km/h)
              </span>
            </div>
          `,
          iconSize: [48, 56],
          iconAnchor: [24, 50],
          popupAnchor: [0, -48]
        });

        // Update / Add Shop Marker
        if (!markersRef.current.shop) {
          markersRef.current.shop = L.marker([shopCoords.lat, shopCoords.lng], { icon: shopIcon })
            .addTo(map)
            .bindPopup(`
              <div style="font-family: system-ui, sans-serif; padding: 4px; min-width: 170px;">
                <span style="font-size: 10px; font-weight: 800; color: #059669; text-transform: uppercase;">🏪 Origin Merchant</span>
                <b style="font-size: 13px; color: #0f172a; display: block; margin-top: 2px;">${order?.shopDetails?.shopName || 'Merchant Store'}</b>
                <div style="font-size: 11px; color: #64748b; margin-top: 2px;">${order?.shopDetails?.shopAddress || 'Visakhapatnam'}</div>
                <div style="font-size: 11px; color: #0284c7; font-weight: bold; margin-top: 4px;">Phone: ${order?.shopDetails?.phone || '+91 891 254 1102'}</div>
              </div>
            `);
        } else {
          markersRef.current.shop.setLatLng([shopCoords.lat, shopCoords.lng]);
        }

        // Update / Add Customer Marker
        if (!markersRef.current.cust) {
          markersRef.current.cust = L.marker([custCoords.lat, custCoords.lng], { icon: custIcon })
            .addTo(map)
            .bindPopup(`
              <div style="font-family: system-ui, sans-serif; padding: 4px; min-width: 170px;">
                <span style="font-size: 10px; font-weight: 800; color: #0284c7; text-transform: uppercase;">📍 Your Delivery Address</span>
                <b style="font-size: 13px; color: #0f172a; display: block; margin-top: 2px;">${order?.customerLocation?.address || 'Diamond Park, Visakhapatnam'}</b>
                <div style="font-size: 11px; color: #059669; font-weight: bold; margin-top: 4px;">Give OTP #${order?.deliveryOtp} at doorstep</div>
              </div>
            `);
        } else {
          markersRef.current.cust.setLatLng([custCoords.lat, custCoords.lng]);
        }

        // Update / Add Courier Marker
        if (!markersRef.current.courier) {
          markersRef.current.courier = L.marker([courierLat, courierLng], { icon: courierIcon, zIndexOffset: 1000 })
            .addTo(map)
            .bindPopup(`
              <div style="font-family: system-ui, sans-serif; padding: 4px; min-width: 170px;">
                <span style="font-size: 10px; font-weight: 800; color: #0284c7; text-transform: uppercase;">🛵 Live Courier Tracking</span>
                <b style="font-size: 13px; color: #0f172a; display: block; margin-top: 2px;">${courier.riderName || 'Ravi Kumar'}</b>
                <div style="font-size: 11px; color: #334155; margin-top: 2px;">Speed: <b>${courier.speed || 28} km/h</b> • ETA: <b>~${courier.etaMinutes || 5} mins</b></div>
                <div style="font-size: 11px; color: #64748b; margin-top: 2px;">Vehicle: ${courier.vehicleNo || 'Hero Electric'}</div>
              </div>
            `);
        } else {
          markersRef.current.courier.setLatLng([courierLat, courierLng]);
          markersRef.current.courier.setIcon(courierIcon);
        }

        // Route polyline connecting Store -> Courier -> Customer
        const routeCoords = [
          [shopCoords.lat, shopCoords.lng],
          [courierLat, courierLng],
          [custCoords.lat, custCoords.lng]
        ];

        if (!polylineRef.current) {
          polylineRef.current = L.polyline(routeCoords, {
            color: '#0284c7',
            weight: 5,
            opacity: 0.85,
            dashArray: '8, 8'
          }).addTo(map);
        } else {
          polylineRef.current.setLatLngs(routeCoords);
        }

        // Fit bounds comfortably with padding
        try {
          const group = L.featureGroup([markersRef.current.shop, markersRef.current.cust, markersRef.current.courier]);
          map.fitBounds(group.getBounds().pad(0.25));
        } catch (e) {}

        const t = setTimeout(() => {
          map.invalidateSize();
        }, 200);

        return () => clearTimeout(t);
      }, [shopCoords.lat, shopCoords.lng, custCoords.lat, custCoords.lng, courierLat, courierLng, order?.deliveryStatus]);

      return (
        <div className="space-y-3">
          {/* Header info bar with Google Maps navigation link */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3.5 rounded-2xl bg-slate-900 text-white shadow-lg border border-slate-800">
            <div className="flex items-center space-x-2.5">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
              <div>
                <span className="text-xs font-black uppercase tracking-wider text-sky-400 font-mono block">
                  Visakhapatnam Street Map • Live Tracking
                </span>
                <span className="text-[11px] text-slate-400">
                  {order?.shopDetails?.shopName || 'Store'} → {order?.customerLocation?.address || 'Doorstep'}
                </span>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <span className="text-[11px] font-mono bg-sky-950 px-2.5 py-1 rounded-full text-sky-300 font-bold border border-sky-800 whitespace-nowrap">
                ETA: ~{courier.etaMinutes} mins • {courier.distanceMeters || Math.round((1 - progressRatio) * 1000)}m
              </span>
              <a
                href={googleMapsDirUrl}
                target="_blank"
                rel="noopener noreferrer"
                className="flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold transition shadow whitespace-nowrap"
                title="Launch turn-by-turn navigation in Google Maps app or website"
              >
                <span>🗺️</span>
                <span>Open in Google Maps ↗</span>
              </a>
            </div>
          </div>

          {/* Map canvas */}
          <div className="relative rounded-3xl overflow-hidden border-2 border-sky-400/50 shadow-2xl h-[340px] sm:h-[420px] w-full bg-slate-100">
            <div ref={mapContainerRef} className="w-full h-full" style={{ zIndex: 1 }} />
          </div>
        </div>
      );
    }

    // ==========================================
    // HYPERLOCAL RADAR STORE MAP (LEAFLET + GOOGLE MAPS)
    // ==========================================
    function HyperlocalRadarMap({ gpsState, radiusKm = 1.0, shops = [] }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const circleRef = useRef(null);
      const markersRef = useRef([]);

      const userLat = gpsState?.lat || VIZAG_DEFAULT_LOCATION.lat;
      const userLng = gpsState?.lng || VIZAG_DEFAULT_LOCATION.lng;

      useEffect(() => {
        if (!mapContainerRef.current || typeof L === 'undefined') return;

        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: [userLat, userLng],
            zoom: 14,
            zoomControl: false,
            attributionControl: false
          });

          L.control.zoom({ position: 'topright' }).addTo(map);
          L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            subdomains: ['a', 'b', 'c']
          }).addTo(map);

          mapInstanceRef.current = map;
        }

        const map = mapInstanceRef.current;

        // Clear existing markers
        markersRef.current.forEach(m => map.removeLayer(m));
        markersRef.current = [];

        // Customer Marker
        const userIcon = L.divIcon({
          className: 'custom-map-pin',
          html: `
            <div style="display:flex; flex-direction:column; align-items:center;">
              <div style="width:34px; height:34px; border-radius:10px; background:#1e1b4b; border:2px solid #38bdf8; color:#38bdf8; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(14,165,233,0.4); font-size:16px;">
                📍
              </div>
              <span style="font-size:8px; font-weight:900; background:#1e1b4b; color:#ffffff; padding:1px 4px; border-radius:4px; margin-top:2px;">
                YOU
              </span>
            </div>
          `,
          iconSize: [36, 42],
          iconAnchor: [18, 38],
          popupAnchor: [0, -36]
        });

        const userMarker = L.marker([userLat, userLng], { icon: userIcon })
          .addTo(map)
          .bindPopup(`<b>📍 Your Location</b><br/>${gpsState?.address || 'Dwaraka Nagar, Visakhapatnam'}`);
        markersRef.current.push(userMarker);

        // Radar circle showing distance tier
        if (circleRef.current) {
          map.removeLayer(circleRef.current);
        }
        // Radar circle showing distance tier
        if (circleRef.current) {
          map.removeLayer(circleRef.current);
        }
        circleRef.current = L.circle([userLat, userLng], {
          radius: radiusKm === 20.0 ? 19000 : radiusKm * 1000,
          color: radiusKm === 20.0 ? '#10b981' : radiusKm === 1.0 ? '#0284c7' : '#6366f1',
          fillColor: radiusKm === 20.0 ? '#10b981' : radiusKm === 1.0 ? '#38bdf8' : '#818cf8',
          fillOpacity: 0.10,
          weight: 2.5
        }).addTo(map);

        // Deduplicate pins for 20 KM view to prevent 5 overlapping pins in Dwaraka Nagar
        const displayShops = radiusKm === 20.0
          ? [
              shops.find(s => s.shopId === 'vizag_shop_1') || shops[0],
              shops.find(s => s.shopId === 'vizag_shop_7'), // Siripuram
              shops.find(s => s.shopId === 'vizag_shop_5'), // Jagadamba
              shops.find(s => s.shopId === 'vizag_shop_maddilapalem'), // Maddilapalem
              shops.find(s => s.shopId === 'vizag_shop_8'), // MVP
              shops.find(s => s.shopId === 'vizag_shop_nad'), // NAD
              shops.find(s => s.shopId === 'vizag_shop_rushikonda'), // Rushikonda
              shops.find(s => s.shopId === 'vizag_shop_11'), // Madhurawada Wholesale
              shops.find(s => s.shopId === 'vizag_shop_10'), // Gajuwaka Industrial
              shops.find(s => s.shopId === 'vizag_shop_12')  // Autonagar Mega Mart
            ].filter(Boolean)
          : shops;

        // Add Shop Pins with clear, unclipped distance badges
        displayShops.forEach(shop => {
          const isWholesale = shop.tier === '20km';
          const shopIcon = L.divIcon({
            className: 'custom-map-pin',
            html: `
              <div style="display:flex; flex-direction:column; align-items:center; cursor:pointer;">
                <div style="width:32px; height:32px; border-radius:10px; background:${isWholesale ? '#064e3b' : '#0f172a'}; border:2px solid ${isWholesale ? '#34d399' : '#38bdf8'}; color:#ffffff; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.3); font-size:15px;">
                  ${isWholesale ? '🏢' : '🏪'}
                </div>
                <span style="font-size:9px; font-weight:900; background:${isWholesale ? '#064e3b' : '#0f172a'}; color:${isWholesale ? '#6ee7b7' : '#7dd3fc'}; padding:2px 6px; border-radius:5px; margin-top:2px; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,0.4); border:1.5px solid ${isWholesale ? '#34d399' : '#38bdf8'};">
                  ${shop.distanceKm} km
                </span>
              </div>
            `,
            iconSize: [36, 44],
            iconAnchor: [18, 38],
            popupAnchor: [0, -36]
          });

          const googleShopUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.name + ' ' + shop.address)}`;

          const m = L.marker([shop.lat, shop.lng], { icon: shopIcon })
            .addTo(map)
            .bindPopup(`
              <div style="font-family: system-ui, sans-serif; padding: 3px; min-width: 190px;">
                <div style="font-size: 10px; font-weight: 800; color: ${isWholesale ? '#059669' : '#0284c7'}; text-transform: uppercase;">
                  ${isWholesale ? '🔥 WHOLESALE DEPOT' : `${shop.distanceKm} km road distance`}
                </div>
                <b style="font-size: 13px; color: #0f172a; display: block; margin-top: 2px;">${shop.name}</b>
                <div style="font-size: 11px; color: #64748b; margin-top: 2px;">${shop.address}</div>
                <div style="font-size: 11px; font-weight: bold; color: #0f172a; margin-top: 4px;">${shop.priceTag} • ${shop.distanceKm} km away</div>
                <a href="${googleShopUrl}" target="_blank" rel="noopener noreferrer" style="display: inline-block; margin-top: 6px; font-size: 10px; color: #0284c7; font-weight: bold; text-decoration: underline;">
                  📍 Open Store in Google Maps ↗
                </a>
              </div>
            `);
          markersRef.current.push(m);
        });

        // Frame strictly the Visakhapatnam Metropolitan Corridor (Zero Narsipatnam/Elamanchili sprawl)
        const fitMapToRadius = () => {
          if (!map) return;
          if (radiusKm === 20.0) {
            // Frame Visakhapatnam Metropolitan City from Madhurawada (North) to Autonagar (South)
            const vizag20KmUrbanBounds = L.latLngBounds([
              [17.675, 83.185],
              [17.820, 83.370]
            ]);
            map.fitBounds(vizag20KmUrbanBounds, { padding: [15, 15] });
          } else if (radiusKm === 10.0) {
            const vizag10KmBounds = L.latLngBounds([
              [17.700, 83.218],
              [17.790, 83.385]
            ]);
            map.fitBounds(vizag10KmBounds, { padding: [15, 15] });
          } else if (radiusKm === 5.0) {
            const vizag5KmBounds = L.latLngBounds([
              [17.708, 83.292],
              [17.748, 83.342]
            ]);
            map.fitBounds(vizag5KmBounds, { padding: [15, 15] });
          } else {
            const vizag1KmBounds = L.latLngBounds([
              [17.722, 83.300],
              [17.735, 83.315]
            ]);
            map.fitBounds(vizag1KmBounds, { padding: [20, 20], maxZoom: 16 });
          }
        };

        fitMapToRadius();

        const t = setTimeout(() => {
          map.invalidateSize();
          fitMapToRadius();
        }, 200);

        return () => clearTimeout(t);
      }, [userLat, userLng, radiusKm, shops]);

      return (
        <div className="p-4 sm:p-5 rounded-3xl glass-card space-y-3">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div className="flex items-center space-x-2">
              <span className="text-base">🗺️</span>
              <div>
                <h4 className="font-bold text-slate-900 text-xs sm:text-sm uppercase tracking-wider">
                  Visakhapatnam Store Radar Map
                </h4>
                <p className="text-[11px] text-slate-500">
                  {radiusKm} KM radius from your location • {shops.length} verified stores located
                </p>
              </div>
            </div>

            <a
              href="https://www.google.com/maps/search/electronics+and+hardware+near+Dwaraka+Nagar+Visakhapatnam"
              target="_blank"
              rel="noopener noreferrer"
              className="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-sky-100 hover:bg-sky-200 text-sky-800 text-[11px] font-bold transition self-start sm:self-auto"

          </div>

          <div className="relative rounded-2xl overflow-hidden border border-slate-200 shadow-md h-[280px] sm:h-[350px] w-full bg-slate-100">
            <div ref={mapContainerRef} className="w-full h-full" style={{ zIndex: 1 }} />
          </div>

    }

              <span className={`text-[10px] px-2 py-0.5 rounded-full font-black ml-1 ${
                selectedSection === 'ALL' ? 'bg-sky-500 text-white' : 'bg-slate-100 text-slate-600'
              }`}>
                {ESSENTIALS_CATALOG.length}
              </span>
            </button>

            {SECTIONS.map(sec => {
              const count = ESSENTIALS_CATALOG.filter(i => i.category === sec.id).length;
              return (
                <button
                  key={sec.id}
                  onClick={() => setSelectedSection(sec.id)}
                  className={`px-3.5 py-2 rounded-2xl text-xs font-bold whitespace-nowrap transition flex items-center space-x-1.5 border ${
                    selectedSection === sec.id
                      ? 'bg-slate-900 text-white border-slate-900 shadow-md ring-2 ring-sky-400/40'
                      : 'bg-white/80 hover:bg-white text-slate-700 border-white/90 shadow-sm'
                  }`}
                >
                  <span>{sec.icon}</span>
                  <span>{sec.title.split(' ')[0]}</span>
                  <span className={`text-[10px] px-2 py-0.5 rounded-full font-black ml-1 ${
                    selectedSection === sec.id ? 'bg-sky-500 text-white' : 'bg-slate-100 text-slate-600'
                  }`}>
                    {count}
                  </span>
                </button>
              );
            })}
          </div>

          {/* DIVIDED CATEGORY SECTIONS */}
          <div className="space-y-10">
            {visibleSections.map(sec => {
              const secItems = ESSENTIALS_CATALOG.filter(item => {
                if (item.category !== sec.id) return false;
                if (!catalogSearch.trim()) return true;
                const q = catalogSearch.toLowerCase();
                return item.name.toLowerCase().includes(q) || 
                       (item.searchQuery && item.searchQuery.toLowerCase().includes(q));
              });

              if (secItems.length === 0) {
                if (catalogSearch.trim()) return null;
              }

              return (
                <div key={sec.id} className="space-y-4 pt-1">
                  {/* Distinct Section Banner */}
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 sm:p-4 rounded-2xl bg-white/80 border border-slate-200/90 shadow-sm backdrop-blur-sm">
                    <div className="flex items-center space-x-3">
                      <span className="text-2xl p-2 rounded-xl bg-slate-100 border border-slate-200 shadow-inner">
                        {sec.icon}
                      </span>
                      <div>
                        <div className="flex items-center space-x-2">
                          <h4 className="text-base sm:text-lg font-black text-slate-900 tracking-tight">
                            {sec.title}
                          </h4>
                          <span className={`text-[10px] font-black uppercase tracking-wider px-2.5 py-0.5 rounded-full border ${sec.badgeStyle}`}>
                            {sec.badge}
                          </span>
                        </div>
                        <p className="text-xs text-slate-500 font-medium mt-0.5">
                          {sec.subtitle}
                        </p>
                      </div>
                    </div>

                    <div className="flex items-center space-x-2 self-start sm:self-center">
                      <span className="text-xs font-bold text-slate-700 bg-slate-100 px-3 py-1 rounded-full border border-slate-200">
                        {secItems.length} Verified Items
                      </span>
                    </div>
                  </div>

                  {/* Section Products Grid */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {secItems.map(prod => {
                      const discountPct = prod.mrp ? Math.round(((prod.mrp - prod.price) / prod.mrp) * 100) : 0;
                      const prodImage = (typeof PRODUCT_ACCURATE_SVGS !== 'undefined' && PRODUCT_ACCURATE_SVGS[prod.id]) 
                        ? PRODUCT_ACCURATE_SVGS[prod.id] 
                        : (prod.image || getProductSvgFallback(prod.category, prod.name));

                      return (
                        <div
                          key={prod.id}
                          className="rounded-2xl bg-white border border-slate-200/90 shadow-sm hover:shadow-xl transition-all duration-200 hover:-translate-y-1 flex flex-col justify-between overflow-hidden group"
                        >
                          {/* Image Container with Accurate SVG Illustration */}
                          <div className="relative h-44 w-full bg-slate-950 overflow-hidden border-b border-slate-100 flex items-center justify-center">
                            <img
                              src={prodImage}
                              alt={prod.name}
                              className="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300"
                              loading="lazy"
                              onError={(e) => {
                                e.target.onerror = null;
                                e.target.src = getProductSvgFallback(prod.category, prod.name);
                              }}
                            />
                            <div className="absolute top-2.5 left-2.5 flex items-center space-x-1">
                              <span className="text-[10px] font-black uppercase tracking-wider bg-slate-900/90 backdrop-blur-md text-white px-2.5 py-0.5 rounded-full shadow">
                                {prod.categoryIcon} {prod.category}
                              </span>
                            </div>
                            {discountPct > 0 && (
                              <div className="absolute top-2.5 right-2.5">
                                <span className="text-[10px] font-black uppercase tracking-wider bg-emerald-600 text-white px-2.5 py-0.5 rounded-full shadow">
                                  {discountPct}% OFF
                                </span>
                              </div>
                            )}
                            <div className="absolute bottom-2.5 left-2.5">
                              <span className="text-[10px] font-bold text-slate-800 bg-white/95 backdrop-blur-sm px-2.5 py-0.5 rounded-lg shadow-sm border border-slate-200">
                                📦 {prod.unit}
                              </span>
                            </div>
                          </div>

                          {/* Body Content - Image and Price visible simultaneously */}
                          <div className="p-3.5 flex flex-col justify-between flex-grow space-y-2.5">
                            <div>
                              <div className="flex items-center justify-between text-[11px] text-slate-500 mb-1">
                                <span className="font-bold text-sky-700">{prod.tag}</span>
                                <span className="font-bold text-amber-500 flex items-center space-x-0.5">
                                  <span>★</span>
                                  <span>{prod.rating}</span>
                                </span>
                              </div>
                              <h4 className="text-sm font-black text-slate-900 line-clamp-2 leading-snug">
                                {prod.name}
                              </h4>
                            </div>

                            {/* Price and Action visible at the same time */}
                            <div className="pt-2 border-t border-slate-100 flex items-center justify-between">
                              <div>
                                <div className="flex items-baseline space-x-1.5">
                                  <span className="text-xl font-black text-slate-950">
                                    ₹{prod.price}
                                  </span>
                                  {prod.mrp && prod.mrp > prod.price && (
                                    <span className="text-xs text-slate-400 line-through font-bold">
                                      ₹{prod.mrp}
                                    </span>
                                  )}
                                </div>
                                <span className="text-[9px] font-black uppercase tracking-wider text-emerald-700 block">
                                  Verified Local Price
                                </span>
                              </div>

                              <button
                                type="button"
                                onClick={() => onQuickPing(prod)}
                                className="px-3.5 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 active:scale-95 text-white font-bold text-xs uppercase tracking-wider shadow-md shadow-sky-500/25 flex items-center space-x-1.5 transition"
                              >
                                <span>⚡</span>
                                <span>Radar Ping</span>
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Empty search state */}
          {catalogSearch.trim() && !visibleSections.some(sec => 
            ESSENTIALS_CATALOG.some(i => i.category === sec.id && (
              i.name.toLowerCase().includes(catalogSearch.toLowerCase()) || 
              (i.searchQuery && i.searchQuery.toLowerCase().includes(catalogSearch.toLowerCase()))
            ))
          ) && (
            <div className="text-center py-10 text-slate-500 text-xs">
              No essentials match "{catalogSearch}". Try searching for "pen", "paper", "Red Bull", or "charger".
            </div>
          )}
        </div>
      );
    }

    function CustomerView({ onBroadcastPing, activeBroadcast, claimedBroadcast, currentOrder, onResetBroadcast, onCompletePayment, gpsState, onRequestGPS, onSimulateCourierAdvance, onExpandRadius, onSelectNeighborhood }) {
      const [query, setQuery] = useState('');
      const [selectedBounty, setSelectedBounty] = useState(20);
      const [radiusKm, setRadiusKm] = useState(1.0); // 1.0 (Primary) | 5.0 | 10.0 | 20.0
      const [isPaymentOpen, setIsPaymentOpen] = useState(false);
      const [selectedQuoteForPay, setSelectedQuoteForPay] = useState(null);
      const [nearbyShops, setNearbyShops] = useState([]);
      const [isRouting, setIsRouting] = useState(false);

      useEffect(() => {
        setNearbyShops(getShopsWithinRadius(gpsState?.lat || 17.7286, gpsState?.lng || 83.3093, radiusKm));
      }, [gpsState, radiusKm]);

      const handleBroadcast = async (e) => {
        if (e) e.preventDefault();
        if (!query.trim()) return;

        setIsRouting(true);
        await new Promise(r => setTimeout(r, 1000));

        const qText = query.trim();
        const matched = findMatchingCatalogItem(qText);
        const resolvedCategory = matched ? (
          matched.category === 'Stationery' ? 'Stationery & Office' :
          matched.category === 'Snacks' ? 'Snacks & Juices' :
          matched.category === 'Juices' ? 'Snacks & Juices' : 'Electronics & Hardware'
        ) : 'Electronics & Hardware';

        await onBroadcastPing({
          item: matched ? matched.name : qText,
          category: resolvedCategory,
          bounty: selectedBounty,
          location: { address: gpsState?.address || 'Dwaraka Nagar, Visakhapatnam', lat: gpsState?.lat || 17.7286, lng: gpsState?.lng || 83.3093 },
          radiusKm: radiusKm,
          estimatedPrice: matched ? matched.price : 120,
          productImage: matched ? matched.image : getProductSvgFallback(resolvedCategory, qText),
          productData: matched
        });

        setIsRouting(false);
      };

      const handleQuickPingFromCatalog = async (product) => {
        setQuery(product.name);
        setIsRouting(true);
        await new Promise(r => setTimeout(r, 800));
        await onBroadcastPing({
          item: product.name,
          category: product.category === 'Stationery' ? 'Stationery & Office' : 
                    product.category === 'Snacks' ? 'Snacks & Juices' : 
                    product.category === 'Juices' ? 'Snacks & Juices' : 'Electronics & Hardware',
          bounty: selectedBounty,
          location: { address: gpsState?.address || 'Dwaraka Nagar, Visakhapatnam', lat: gpsState?.lat || 17.7286, lng: gpsState?.lng || 83.3093 },
          radiusKm: radiusKm,
          estimatedPrice: product.price,
          productImage: product.image,
          productData: product
        });
        setIsRouting(false);
      };

      const handleSelectQuoteToPay = (quote) => {
        setSelectedQuoteForPay(quote);
        setIsPaymentOpen(true);
      };

      const availableQuotes = claimedBroadcast?.quotes || (claimedBroadcast?.claimData ? [claimedBroadcast.claimData] : []);
      const activeClaimForPay = selectedQuoteForPay 
        ? { ...claimedBroadcast, claimData: selectedQuoteForPay }
        : claimedBroadcast;

      return (
        <div className="w-full max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-12 flex flex-col items-center">
          
          {/* Main Hero Header */}
          <div className="text-center max-w-3xl mb-8 space-y-3">
            <span className="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-white/60 border border-white/80 text-xs font-bold text-sky-800 uppercase tracking-widest">
              <span className="w-2 h-2 rounded-full bg-sky-500 animate-ping"></span>
              <span>1 KM Hyperlocal & Extended Wholesale Network • Vizag</span>
            </span>
            <h1 className="text-4xl sm:text-6xl font-black text-slate-900 uppercase tracking-tight leading-[1.08]">
              FIND & BUY LOCALLY, <span className="bg-gradient-to-r from-sky-600 to-indigo-600 bg-clip-text text-transparent">1KM TO 20KM.</span>
            </h1>
            <p className="text-sm sm:text-base text-slate-600 max-w-2xl mx-auto">
              Primary 1 KM emergency radar for instant 10-minute delivery. Expand to 5km, 10km, or 20km wholesale hubs to compare quotes and buy where it is cheapest!
            </p>
          </div>

          {!activeBroadcast && !claimedBroadcast && !currentOrder && (
            <div className="w-full max-w-3xl space-y-6">
              
              {/* Location Center Anchor Bar */}
              <div className="p-4 sm:p-5 rounded-3xl glass-card flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-2xl bg-sky-100 text-sky-600 border border-sky-200 flex items-center justify-center font-bold text-lg shadow-sm">
                    📍
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <span className="font-bold text-slate-900 text-xs uppercase tracking-wider">
                        Search Center Anchor
                      </span>
                      <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">
                        {gpsState?.isLive ? '📡 Device GPS Locked' : '📍 Calibrated Vizag Anchor'}
                      </span>
                    </div>
                    <p className="text-xs text-slate-600 font-medium">
                      {gpsState?.address || 'Dwaraka Nagar, Visakhapatnam'} ({gpsState?.lat?.toFixed(4)}°N, {gpsState?.lng?.toFixed(4)}°E)
                    </p>
                  </div>
                </div>

                <div className="flex items-center space-x-2">
                  <select
                    value={VIZAG_NEIGHBORHOODS.find(n => Math.abs(n.lat - (gpsState?.lat || 0)) < 0.005 && Math.abs(n.lng - (gpsState?.lng || 0)) < 0.005)?.id || 'dwaraka'}
                    onChange={(e) => {
                      const found = VIZAG_NEIGHBORHOODS.find(n => n.id === e.target.value);
                      if (found && onSelectNeighborhood) {
                        onSelectNeighborhood(found);
                      }
                    }}
                    className="px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs font-bold text-slate-800 shadow-sm outline-none focus:ring-2 focus:ring-sky-500"
                  >
                    {VIZAG_NEIGHBORHOODS.map(n => (
                      <option key={n.id} value={n.id}>{n.name}</option>
                    ))}
                  </select>

                  <button
                    type="button"
                    onClick={onRequestGPS}
                    title="Detect live GPS from device hardware"
                    className="px-3 py-2 rounded-xl bg-sky-50 hover:bg-sky-100 border border-sky-200 text-sky-700 text-xs font-bold transition flex items-center space-x-1 shadow-sm"
                  >
                    <span>📡</span>
                    <span className="hidden sm:inline">Use GPS</span>
                  </button>
                </div>
              </div>

              {/* Search Radius Scope Selector */}
              <div className="p-4 sm:p-5 rounded-3xl glass-card space-y-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <IconRadar className="w-4 h-4 text-sky-600 animate-spin-slow" />
                    <span className="font-bold text-slate-900 text-xs sm:text-sm uppercase tracking-wider">
                      Select Search Radius Scope
                    </span>
                  </div>
                  <span className="text-[11px] font-bold text-sky-700 bg-sky-100 px-2.5 py-0.5 rounded-full">
                    {radiusKm === 1.0 ? '1 KM Default (Fastest)' : `${radiusKm} KM Expanded (Cheaper Deals)`}
                  </span>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  {[
                    { r: 1.0, label: '1 KM', desc: 'Hyperlocal (< 10 mins)', badge: 'PRIMARY', color: 'sky' },
                    { r: 5.0, label: '5 KM', desc: 'Neighborhood (~18 mins)', badge: '18% OFF', color: 'indigo' },
                    { r: 10.0, label: '10 KM', desc: 'City Hubs (~28 mins)', badge: '30% OFF', color: 'purple' },
                    { r: 20.0, label: '20 KM', desc: 'Wholesale Depot (~40 mins)', badge: 'CHEAPEST 🔥', color: 'emerald' }
                  ].map(item => (
                    <button
                      key={item.r}
                      type="button"
                      onClick={() => setRadiusKm(item.r)}
                      className={`p-3 rounded-2xl text-left transition flex flex-col justify-between border ${
                        radiusKm === item.r
                          ? 'bg-slate-900 text-white border-slate-900 shadow-lg ring-2 ring-sky-400/50'
                          : 'bg-white/70 hover:bg-white text-slate-700 border-white/80'
                      }`}
                    >
                      <div className="flex items-center justify-between w-full">
                        <span className="text-sm font-black">{item.label}</span>
                        <span className={`text-[9px] font-black px-1.5 py-0.5 rounded uppercase ${
                          radiusKm === item.r
                            ? (item.r === 20.0 ? 'bg-emerald-400 text-slate-950' : 'bg-sky-400 text-slate-950')
                            : (item.r === 20.0 ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600')
                        }`}>
                          {item.badge}
                        </span>
                      </div>
                      <span className={`text-[11px] mt-1 ${radiusKm === item.r ? 'text-slate-300' : 'text-slate-500'}`}>
                        {item.desc}
                      </span>
                    </button>
                  ))}
                </div>
              </div>

              {/* Main Distress Search Input Form */}
              <form onSubmit={handleBroadcast} className="relative">
                <div className="relative flex items-center p-2 sm:p-2.5 rounded-full bg-white/70 backdrop-blur-2xl border border-white/90 shadow-lg">
                  <div className="pl-4 pr-3 text-sky-600">
                    <IconSearch className="w-6 h-6" />
                  </div>
                  <input
                    type="text"
                    value={query}
                    onChange={e => setQuery(e.target.value)}
                    placeholder={`What item do you need? (Scanning ${radiusKm} KM radius in Vizag)`}
                    className="w-full bg-transparent text-slate-900 text-base sm:text-xl font-medium focus:outline-none pr-3"
                  />
                  <button
                    type="submit"
                    disabled={isRouting || !query.trim()}
                    className="px-6 py-3.5 rounded-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs uppercase tracking-wider flex items-center space-x-2"
                  >
                    <span>Broadcast {radiusKm}KM Ping</span>
                  </button>
                </div>
              </form>

              {/* VISUAL ESSENTIALS CATALOG (PENS, A4 SHEETS, SNACKS, JUICES, ELECTRONICS) - IMAGES & PRICES PRESENT SIMULTANEOUSLY */}
              <EssentialsCatalogGrid onQuickPing={handleQuickPingFromCatalog} />

              {/* Interactive Visakhapatnam Radar Map */}
              <HyperlocalRadarMap gpsState={gpsState} radiusKm={radiusKm} shops={nearbyShops} />

              {/* Verified Stores Detected Widget */}
              <div className="p-4 sm:p-5 rounded-3xl glass-card space-y-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <IconStore className="w-4 h-4 text-sky-600" />
                    <span className="font-bold text-slate-900 text-xs sm:text-sm uppercase tracking-wider">
                      Verified Stores Detected Within {radiusKm} KM ({nearbyShops.length} Active in Vizag)
                    </span>
                  </div>
                  <span className="text-[11px] font-bold text-emerald-700 bg-emerald-100 px-2.5 py-0.5 rounded-full">
                    {radiusKm === 20.0 ? 'Wholesale & Retail' : radiusKm === 1.0 ? '1 KM Proximity Guard' : 'Extended Range Active'}
                  </span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-56 overflow-y-auto pr-1">
                  {nearbyShops.map(shop => (
                    <div key={shop.shopId} className="p-3 rounded-2xl bg-white/60 border border-white/80 flex items-center justify-between">
                      <div>
                        <div className="flex items-center space-x-2">
                          <h5 className="font-bold text-slate-800 text-xs">{shop.name}</h5>
                          {shop.tier === '20km' && (
                            <span className="text-[9px] font-black text-emerald-700 bg-emerald-100 px-1.5 py-0.2 rounded">WHOLESALE</span>
                          )}
                        </div>
                        <span className="text-[10px] text-slate-500">{shop.area} • {shop.priceTag}</span>
                      </div>
                      <span className={`px-2.5 py-1 rounded-full text-[11px] font-black ${
                        shop.distanceKm <= 1.0 ? 'bg-sky-100 text-sky-800' : shop.distanceKm > 10.0 ? 'bg-emerald-100 text-emerald-800' : 'bg-indigo-100 text-indigo-800'
                      }`}>
                        {shop.distanceKm} km
                      </span>
                    </div>
                  ))}
                </div>
              </div>

              {/* Bounty Selector */}
              <div className="space-y-2">
                <span className="text-xs font-bold uppercase text-slate-600 flex items-center space-x-1.5">
                  <IconCoins className="w-4 h-4 text-amber-500" />
                  <span>Urgency Bounty (Courier & Merchant Incentive)</span>
                </span>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                  {[0, 10, 20, 50].map(val => (
                    <button
                      key={val}
                      type="button"
                      onClick={() => setSelectedBounty(val)}
                      className={`p-3 rounded-2xl border text-left transition ${
                        selectedBounty === val 
                          ? 'bg-white/90 border-sky-500 shadow-md font-bold' 
                          : 'bg-white/40 border-white/70 text-slate-700'
                      }`}
                    >
                      <div className="text-sm font-bold text-slate-900">{val === 0 ? 'Standard' : `+ ₹${val}`}</div>
                      <div className="text-[11px] text-slate-400 font-medium">{val >= 20 ? '< 8 mins' : '< 15 mins'}</div>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* AI Routing Micro-Animation */}
          {isRouting && (
            <div className="w-full max-w-xl p-8 rounded-3xl glass-card text-center space-y-4 my-6">
              <RadarVisualizer active={true} size="compact" />
              <h3 className="text-xl font-bold text-slate-900">Broadcasting Distress Ping within {radiusKm} KM...</h3>
              <p className="text-xs text-slate-500">Scanning {nearbyShops.length} verified stores in Visakhapatnam for quotes</p>
            </div>
          )}

          {/* Active Broadcast waiting for claims */}
          {activeBroadcast && !claimedBroadcast && !isRouting && (
            <div className="w-full max-w-2xl space-y-6 text-center">
              <div className="p-8 rounded-3xl glass-card space-y-5">
                <RadarVisualizer active={true} />
                <div className="inline-block px-3 py-1 rounded-full bg-sky-100 text-sky-800 text-xs font-bold uppercase">
                  Scanning Radius: {activeBroadcast.radiusKm || 1.0} KM
                </div>

                {/* Product Image & Price Present Simultaneously */}
                <div className="flex items-center justify-center space-x-4 p-4 rounded-2xl bg-white/90 border border-slate-200 shadow-sm max-w-md mx-auto">
                  <img 
                    src={activeBroadcast.productImage || getProductSvgFallback(activeBroadcast.category, activeBroadcast.item)} 
                    alt={activeBroadcast.item}
                    className="w-20 h-20 rounded-2xl object-cover border border-slate-200 shadow-sm flex-shrink-0"
                    onError={(e) => { e.target.onerror = null; e.target.src = getProductSvgFallback(activeBroadcast.category, activeBroadcast.item); }}
                  />
                  <div className="text-left">
                    <span className="text-[10px] font-black uppercase tracking-wider text-sky-700 bg-sky-100 px-2.5 py-0.5 rounded-full">
                      {activeBroadcast.category || 'Essential Item'}
                    </span>
                    <h2 className="text-base sm:text-lg font-black text-slate-900 mt-1">{activeBroadcast.item}</h2>
                    <div className="text-sm font-black text-slate-950 mt-0.5">
                      Verified MRP: ₹{activeBroadcast.estimatedPrice || 100}
                    </div>
                  </div>
                </div>

                <p className="text-xs text-slate-500">
                  Alerting verified shops within {activeBroadcast.radiusKm || 1.0} km in Visakhapatnam. Gathering best price quotes...
                </p>

                {/* Expand Radius Action while scanning */}

    // DELIVERY PARTNER (DELIVERY BOY) VIEW
    // ==========================================
    function DeliveryPartnerView({ orders = [], onAcceptOrder, onUpdateStatus, onUpdateCourierLocation, todayEarnings = 180, onRequestGPS }) {
      const [activeGig, setActiveGig] = useState(null);
      const [otpInput, setOtpInput] = useState('');
      const [otpErr, setOtpErr] = useState('');
      const [completed, setCompleted] = useState(false);
      const [courierProgress, setCourierProgress] = useState(25);

      const availableGigs = orders.filter(o => o.deliveryStatus === 'READY_FOR_PICKUP');

      const handleAccept = (order) => {
        setActiveGig({ ...order, stage: 'PICKUP' });
        if (onAcceptOrder) onAcceptOrder(order.orderId);
      };

      const handleConfirmPickup = () => {
        if (!activeGig) return;
        setActiveGig(prev => ({ ...prev, stage: 'IN_TRANSIT' }));
        setCourierProgress(30);
        if (onUpdateStatus) onUpdateStatus(activeGig.orderId, 'IN_TRANSIT');
        if (onUpdateCourierLocation) {
          onUpdateCourierLocation(activeGig.orderId, {
            progress: 30,
            speed: 28,
            etaMinutes: 5,
            distanceMeters: 450,
            riderName: 'Ravi Kumar',
            vehicleNo: 'Hero Electric (AP 31 DZ 4421)'
          });
        }
      };

      const handleAdvanceCourierGps = () => {
        if (!activeGig) return;
        setCourierProgress(prev => {
          const next = Math.min(95, prev + 20);
          const eta = Math.max(1, Math.round((100 - next) / 16));
          const dist = Math.max(50, Math.round((100 - next) * 6));
          if (onUpdateCourierLocation) {
            onUpdateCourierLocation(activeGig.orderId, {
              progress: next,
              speed: 28,
              etaMinutes: eta,
              distanceMeters: dist,
              riderName: 'Ravi Kumar',
              vehicleNo: 'Hero Electric (AP 31 DZ 4421)'
            });
          }
          return next;
        });
      };

      // Periodic location pulse while on the road
      useEffect(() => {
        if (!activeGig || activeGig.stage !== 'IN_TRANSIT') return;
        const timer = setInterval(() => {
          handleAdvanceCourierGps();
        }, 6000);
        return () => clearInterval(timer);
      }, [activeGig?.stage, activeGig?.orderId]);

      const handleVerifyOtp = () => {
        if (!activeGig) return;
        if (otpInput.trim() === activeGig.deliveryOtp) {
          setCompleted(true);
          if (onUpdateStatus) onUpdateStatus(activeGig.orderId, 'DELIVERED');
          if (onUpdateCourierLocation) {
            onUpdateCourierLocation(activeGig.orderId, {
              progress: 100,
              speed: 0,
              etaMinutes: 0,
              distanceMeters: 0,
              riderName: 'Ravi Kumar',
              vehicleNo: 'Hero Electric (AP 31 DZ 4421)'
            });
          }
          setActiveGig(null);
        } else {
          setOtpErr('Invalid OTP! Please enter the 4 digits from the customer.');
        }
      };

      return (
        <div className="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10 space-y-8">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 p-5 rounded-3xl glass-card">
            <div className="flex items-center space-x-3.5">
              <div className="w-12 h-12 rounded-2xl bg-slate-900 text-sky-400 flex items-center justify-center">
                <IconBike className="w-6 h-6" />
              </div>
              <div>
                <h2 className="text-lg font-bold text-slate-900">Ravi Kumar (Vizag Express Courier)</h2>
                <p className="text-xs text-slate-500">Hero Electric Scooter (AP 31 DZ 4421) • Monitoring 1 KM radius</p>
              </div>
            </div>
            <div className="flex items-center space-x-2 text-xs font-bold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full">
              <span>● Accepting 1 KM Gigs</span>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="p-5 rounded-3xl glass-card">
              <span className="text-xs uppercase font-bold text-slate-400">Available 1 KM Gigs</span>
              <div className="text-3xl font-black text-slate-900 mt-1">{availableGigs.length}</div>
